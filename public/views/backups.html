<div class="container-fluid pt-4">
  <div class="cartao mb-4 fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="h5 m-0">Status de Integridade</h3>
      <div class="d-flex align-items-center gap-2">
        <button id="btn-verificar" class="btn btn-primary btn-sm px-3 d-none d-sm-block">Executar Verificação</button>
        <div class="menu-opcoes-cartao-relativo" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="icone-pontos"></span>
        </div>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
          <li><button class="dropdown-item small" type="button">Exportar Log</button></li>
          <li><button class="dropdown-item small" type="button">Detalhes</button></li>
        </ul>
      </div>
    </div>
    <button id="btn-verificar-mobile" class="btn btn-primary btn-sm w-100 mb-4 d-block d-sm-none">Executar
      Verificação</button>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="bg-light">
          <tr class="text-muted small">
            <th class="border-0">Alvo</th>
            <th class="border-0">Status</th>
            <th class="border-0">Última Checagem</th>
            <th class="border-0">Checksum</th>
            <th class="border-0 text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="5" class="text-center text-muted py-4">Aguardando dados reais...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="cartao fade-in mb-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="h5 m-0">Histórico de Backups Antigos</h3>
      <div class="menu-opcoes-cartao-relativo" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="icone-pontos"></span>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
        <li><button class="dropdown-item small" type="button">Exportar CSV</button></li>
      </ul>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle border rounded">
        <thead class="bg-light">
          <tr class="text-muted small">
            <th class="border-0">Data / Hora</th>
            <th class="border-0">Arquivo / Identificador</th>
            <th class="border-0">Tamanho</th>
            <th class="border-0">Regra de Retenção</th>
            <th class="border-0 text-end">Ações</th>
          </tr>
        </thead>
        <tbody id="backups-table-body">
          <tr>
            <td colspan="5" class="text-center text-muted py-4">Aguardando dados reais...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="cartao fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="h5 m-0">Log de Eventos</h3>
      <div class="menu-opcoes-cartao-relativo" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="icone-pontos"></span>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
        <li><button class="dropdown-item small" type="button">Limpar Log</button></li>
      </ul>
    </div>
    <div class="d-flex flex-column gap-2 font-monospace" id="backups-log-container"
      style="font-size: 0.85rem; overflow-wrap: break-word; word-break: break-word; max-height: 250px; overflow-y: auto;">
      <div class="text-muted">Aguardando dados...</div>
    </div>
  </div>
</div>
