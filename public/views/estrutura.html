<section class="cartao schema-workbench">
  <div class="section-heading">
    <div>
      <h3>Estrutura do banco</h3>
      <p>Explore tabelas, views, colunas, índices e relacionamentos consultados diretamente no catálogo.</p>
    </div>
    <div class="dropdown">
      <button class="action-menu-button" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Abrir ações da estrutura"><i class="bi bi-three-dots-vertical" aria-hidden="true"></i></button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><button id="btn-atualizar-estrutura" class="dropdown-item" type="button">Atualizar catálogo</button></li>
        <li><button id="btn-reorganizar-schema" class="dropdown-item" type="button">Reorganizar mapa</button></li>
        <li><button id="btn-centralizar-schema" class="dropdown-item" type="button">Centralizar mapa</button></li>
        <li><button id="btn-exportar-schema" class="dropdown-item" type="button">Baixar JSON</button></li>
      </ul>
    </div>
  </div>

  <div class="schema-toolbar">
    <div class="schema-view-switch" role="group" aria-label="Forma de apresentação">
      <button type="button" class="active" data-schema-view="map" aria-pressed="true">Mapa relacional</button>
      <button type="button" data-schema-view="catalog" aria-pressed="false">Catálogo</button>
    </div>
    <label class="schema-search">
      <span>Filtrar estrutura</span>
      <input type="search" class="form-control form-control-sm" id="schema-search-input" placeholder="Tabela, view ou coluna" autocomplete="off">
    </label>
  </div>

  <div id="schema-explorer-container" aria-live="polite">
    <div class="loading-state"><span class="loading-indicator" aria-hidden="true"></span>Consultando o catálogo</div>
  </div>
</section>
