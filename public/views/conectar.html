<div class="cartao">
  <div class="section-heading">
    <div>
      <h3>Conectar banco de dados</h3>
      <p>As credenciais serão testadas antes de serem salvas na instalação do Cerberus.</p>
    </div>
  </div>

  <form id="form-conectar-banco" class="row g-3" novalidate>
    <div class="col-12 col-md-4">
      <label class="form-label" for="db-engine">Tecnologia</label>
      <select id="db-engine" class="form-select" required>
        <option value="postgresql" selected>PostgreSQL</option>
        <option value="mysql">MySQL</option>
      </select>
    </div>
    <div class="col-12 col-md-5">
      <label class="form-label" for="db-host">Host</label>
      <input type="text" id="db-host" class="form-control" placeholder="localhost" maxlength="255" autocomplete="off" required>
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label" for="db-port">Porta</label>
      <input type="number" id="db-port" class="form-control" value="5432" min="1" max="65535" inputmode="numeric" required>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="db-name">Nome do banco</label>
      <input type="text" id="db-name" class="form-control" placeholder="database" maxlength="100" autocomplete="off" required>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="db-user">Usuário</label>
      <input type="text" id="db-user" class="form-control" placeholder="postgres" maxlength="100" autocomplete="username" required>
    </div>
    <div class="col-12">
      <label class="form-label" for="db-pass">Senha do banco</label>
      <input type="password" id="db-pass" class="form-control" placeholder="Informe a senha, se houver" maxlength="255" autocomplete="current-password">
      <div class="form-text">O Cerberus precisa dessa credencial para consultar métricas e executar as operações solicitadas.</div>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary" id="btn-conectar">Testar e conectar</button>
    </div>
  </form>
</div>
